; =============================================================================
; Vokit VMware LAB — dialplan (Django DID-resolve from DB)
; Copy to: /etc/asterisk/extensions.conf on the Ubuntu VM
;
; MUST SET on the VM (do not commit real secrets to git):
;   VOKIT_INTERNAL_TOKEN = same as application/.env VOKIT_INTERNAL_TELEPHONY_TOKEN
;
; DJANGO_RESOLVE_URL points at Windows host Daphne.
; Dial edge at 192.168.56.1:5071 (Windows), not 127.0.0.1.
; =============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
DJANGO_RESOLVE_URL=http://192.168.56.1:8000/internal/telephony/v1/did-resolve/
; >>> REPLACE THIS with your real token from application/.env <<<
VOKIT_INTERNAL_TOKEN=__VOKIT_INTERNAL_TOKEN__

; Softphone / inbound → always CURL Django (inventory + agent + balance)
[from-carrier]
exten => _X.,1,NoOp(Inbound DID=${EXTEN} CID=${CALLERID(all)})
 same => n,Goto(vokit-resolve,${EXTEN},1)

exten => _+!,1,NoOp(Inbound E.164 ${EXTEN})
 same => n,Set(DIGITS=${FILTER(0-9,${EXTEN})})
 same => n,Goto(vokit-resolve,${DIGITS},1)

exten => s,1,NoOp(Inbound s-exten CID=${CALLERID(all)})
 same => n,Hangup(1)

[vokit-resolve]
exten => _X.,1,NoOp(Resolve DID=${EXTEN} via Django)
 same => n,Set(CURLOPT(httptimeout)=10)
 same => n,Set(CURLOPT(httpheader)=X-Vokit-Internal-Token: ${VOKIT_INTERNAL_TOKEN})
 same => n,Set(CURLOPT(httpheader)=Content-Type: application/json)
 same => n,Set(CURL_RESULT=${CURL(${DJANGO_RESOLVE_URL},{"did":"${EXTEN}"})})
 same => n,NoOp(Django response: ${CURL_RESULT})
 same => n,GotoIf($[${REGEX("\"routable\":[[:space:]]*true" ${CURL_RESULT})}]?route:reject)
 same => n(reject),NoOp(DID ${EXTEN} NOT routable — reject without dialing edge)
 same => n,Hangup(21)
 same => n(route),NoOp(DID ${EXTEN} routable — dialing vokit-edge on Windows host)
 same => n,Progress()
 same => n,Dial(PJSIP/vokit-edge/sip:${EXTEN}@192.168.56.1:5071,120)
 same => n,NoOp(Dial status=${DIALSTATUS})
 same => n,Hangup()

; Outbound / attended-transfer consult from vokit-edge
; Specific lab human route MUST be listed before catch-all hangup.
[from-vokit-edge]
; Lab "human" for attended transfer tests (Django Transfer Number +15550001002)
exten => _+15550001002,1,NoOp(Lab transfer to labphone2)
 same => n,Dial(PJSIP/labphone2,45)
 same => n,Hangup()

; SIP-client destination (ADR-006): Django sends numeric extension, Edge keeps digits.
exten => 1002,1,NoOp(Lab SIP client labphone2)
 same => n,Dial(PJSIP/labphone2,45)
 same => n,Hangup()

; Queue members are hunted by Django; this extension is optional Asterisk Queue sugar.
exten => 9000,1,NoOp(Lab support queue)
 same => n,Queue(vokit-lab-support,t,,,45)
 same => n,Hangup()

exten => _+!,1,NoOp(Outbound E.164 ${EXTEN} from vokit-edge)
 same => n,NoOp(No lab trunk configured — hangup)
 same => n,Hangup()

exten => _X.,1,NoOp(Outbound digits ${EXTEN})
 same => n,NoOp(No lab trunk configured — hangup)
 same => n,Hangup()
