; =============================================================================
; Vokit VMware LAB — Asterisk PJSIP
; Copy to: /etc/asterisk/pjsip.conf on the Ubuntu VM
;
; Softphone (MicroSIP on Windows) and edge share host IP 192.168.56.1 —
; identify by username FIRST so REGISTER labphone is not mistaken for vokit-edge.
; =============================================================================

[global]
type=global
endpoint_identifier_order=username,ip,anonymous

[transport-udp-public]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=192.168.56.100
external_signaling_address=192.168.56.100
local_net=127.0.0.0/8
local_net=192.168.56.0/24

[transport-udp-vokit]
type=transport
protocol=udp
bind=0.0.0.0:5070

; --- Lab softphone (AOR id MUST be "labphone" to match REGISTER) ------------
; MicroSIP: Domain/Server 192.168.56.100  User/Login labphone  Pass labphone123

[labphone]
type=endpoint
transport=transport-udp-public
context=from-carrier
disallow=all
allow=ulaw
auth=labphone
aors=labphone
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[labphone]
type=auth
auth_type=userpass
username=labphone
password=labphone123

[labphone]
type=aor
max_contacts=2

; --- Lab "human" softphone for attended transfer tests ---------------------
; Use a separate SIP client (Linphone or second MicroSIP portable), NOT a
; second account inside the same MicroSIP process as labphone.
; Linphone: Domain 192.168.56.100  User labphone2  Pass labphone123  UDP

[labphone2]
type=endpoint
transport=transport-udp-public
context=from-carrier
disallow=all
allow=ulaw
auth=labphone2
aors=labphone2
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[labphone2]
type=auth
auth_type=userpass
username=labphone2
password=labphone123

[labphone2]
type=aor
max_contacts=2

; --- Vokit SIP edge on Windows host ----------------------------------------
; No IP identify here: MicroSIP also comes from 192.168.56.1 and would steal
; REGISTER. Dial() still uses contact URI below for inbound AI.

[vokit-edge]
type=endpoint
transport=transport-udp-vokit
context=from-vokit-edge
disallow=all
allow=ulaw
aors=vokit-edge
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[vokit-edge]
type=aor
contact=sip:192.168.56.1:5071
max_contacts=1
qualify_frequency=0

; Edge-originated consult INVITEs use the configured caller/DID as the
; From username, so username matching alone cannot identify this endpoint.
[vokit-edge-identify]
type=identify
endpoint=vokit-edge
match=192.168.56.1
