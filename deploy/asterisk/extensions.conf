; =============================================================================
; Vokit production — Asterisk dialplan (gateway between carrier and vokit-edge)
; Copy to /etc/asterisk/extensions.conf
;
; Phase 8: Multi-DID path — CURL Django DID-resolve before Dial edge.
; Requires: res_curl module loaded in Asterisk.
;
; ElevenSolution: digits only, NO '+' on trunk INVITEs (e.g. 17134700972).
; vokit-sip-edge sends E.164 WITH '+' (e.g. +18554244706) — must strip before Dial().
;
; Placeholders:
;   __DJANGO_DID_RESOLVE_URL__ = http://127.0.0.1:8000/internal/telephony/v1/did-resolve/
;   __VOKIT_INTERNAL_TOKEN__   = must match Django VOKIT_INTERNAL_TELEPHONY_TOKEN
; =============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; Colocated VPS / same-host default. VMware lab (Asterisk on VM, Django on Windows):
; use deploy/asterisk/lab/extensions.conf instead (points at 192.168.56.1).
DJANGO_RESOLVE_URL=http://127.0.0.1:8000/internal/telephony/v1/did-resolve/
VOKIT_INTERNAL_TOKEN=__VOKIT_INTERNAL_TOKEN__

; Inbound: carrier → Asterisk :5060 → CURL Django → Dial vokit-edge :5071
; All DIDs go through Django DID resolution — no hardcoded DID list.
[from-carrier]
exten => _X.,1,NoOp(Inbound DID=${EXTEN} CID=${CALLERID(all)})
 same => n,Goto(vokit-resolve,${EXTEN},1)

exten => _+!,1,NoOp(Inbound E.164 ${EXTEN})
 same => n,Set(DIGITS=${FILTER(0-9,${EXTEN})})
 same => n,Goto(vokit-resolve,${DIGITS},1)

exten => s,1,NoOp(Inbound s-exten CID=${CALLERID(all)})
 same => n,Hangup(1)

; ---------------------------------------------------------------------------
; DID resolution via Django internal API (OQ-001 multi-DID path)
;
; Uses Asterisk func_curl: Set CURLOPT for headers, POST JSON body to Django,
; then parse the "routable" field from the JSON response.
;
; Fail-closed: if CURL fails or response missing → Hangup without dialing edge.
; ---------------------------------------------------------------------------
[vokit-resolve]
exten => _X.,1,NoOp(Resolve DID=${EXTEN} via Django)
 same => n,Set(CURLOPT(httptimeout)=10)
 same => n,Set(CURLOPT(httpheader)=X-Vokit-Internal-Token: ${VOKIT_INTERNAL_TOKEN})
 same => n,Set(CURLOPT(httpheader)=Content-Type: application/json)
 same => n,Set(CURL_RESULT=${CURL(${DJANGO_RESOLVE_URL},{"did":"${EXTEN}"})})
 same => n,NoOp(Django response: ${CURL_RESULT})
 same => n,GotoIf($[${REGEX("\"routable\":[[:space:]]*true" ${CURL_RESULT})}]?route:reject)
 same => n(reject),NoOp(DID ${EXTEN} NOT routable — reject without dialing edge)
 same => n,Hangup(21)
 same => n(route),NoOp(DID ${EXTEN} routable — dialing vokit-edge)
 same => n,Progress()
 same => n,Dial(PJSIP/vokit-edge/sip:${EXTEN}@127.0.0.1:5071,120)
 same => n,NoOp(Dial status=${DIALSTATUS})
 same => n,Hangup()

; Outbound: vokit-edge → Asterisk :5070 → carrier trunk → PSTN
; vokit always sends '+' in Request-URI; strip to digits before trunk Dial()
; DO NOT add a second _+! that passes '+' through — it overrides this and breaks outbound.
[from-vokit-edge]
exten => _+!,1,NoOp(Outbound E.164 ${EXTEN} from vokit-edge)
 same => n,Set(NUM=${FILTER(0-9,${EXTEN})})
 same => n,GotoIf($[${LEN(${NUM})} > 0]?dial)
 same => n,Hangup()
 same => n(dial),Set(CALLERID(num)=${FILTER(0-9,${CALLERID(num)})})
 same => n,Set(CALLERID(name)=${CALLERID(num)})
 same => n,Dial(PJSIP/${NUM}@elevensolution-trunk,120)
 same => n,Hangup()

; Digits-only fallback (if edge ever strips +)
exten => _X.,1,NoOp(Outbound digits ${EXTEN})
 same => n,Set(NUM=${FILTER(0-9,${EXTEN})})
 same => n,GotoIf($[${LEN(${NUM})} > 0]?dial)
 same => n,Hangup()
 same => n(dial),Set(CALLERID(num)=${FILTER(0-9,${CALLERID(num)})})
 same => n,Set(CALLERID(name)=${CALLERID(num)})
 same => n,Dial(PJSIP/${NUM}@elevensolution-trunk,120)
 same => n,Hangup()
