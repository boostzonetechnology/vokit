; =============================================================================
; Vokit production — Asterisk PJSIP gateway (ElevenSolution / IP-auth trunk)
; Copy to /etc/asterisk/pjsip.conf on the VPS
;
; ElevenSolution uses numbers WITHOUT '+' (digits only, e.g. 17134700972).
; Replace placeholders with digits-only values (no + prefix):
;   __VPS_PUBLIC_IP__  __PROVIDER_TRUNK_IP__
;   __SIP_DEFAULT_FROM__  (caller ID, e.g. 17134700972)
; =============================================================================

; --- Transports -------------------------------------------------------------

[transport-udp-public]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=__VPS_PUBLIC_IP__
external_signaling_address=__VPS_PUBLIC_IP__
local_net=127.0.0.0/8
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

[transport-udp-vokit]
type=transport
protocol=udp
bind=127.0.0.1:5070

; --- ElevenSolution / carrier trunk (IP whitelist, PCMU, no + in numbers) ----

[elevensolution-trunk]
type=endpoint
transport=transport-udp-public
context=from-carrier
disallow=all
allow=ulaw
aors=elevensolution-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
trust_id_inbound=yes
send_pai=yes
send_rpid=yes
; digits only — no '+' (ElevenSolution requirement)
from_user=__SIP_DEFAULT_FROM__
from_domain=__VPS_PUBLIC_IP__
callerid=__SIP_DEFAULT_FROM__

[elevensolution-aor]
type=aor
contact=sip:__PROVIDER_TRUNK_IP__:5060
; Many IP trunks do not answer OPTIONS — disable qualify to avoid Unavail
qualify_frequency=0

[elevensolution-identify]
type=identify
endpoint=elevensolution-trunk
match=__PROVIDER_TRUNK_IP__
; If inbound INVITEs come from an extra ElevenSolution SBC IP, add another identify:
; [elevensolution-identify-2]
; type=identify
; endpoint=elevensolution-trunk
; match=OTHER_SBC_IP

; DO NOT use open [anonymous] → from-carrier. That answers internet SIP scanners
; (random DIDs) and floods vokit-edge. Unidentified peers are rejected by PJSIP.

; --- Vokit SIP edge (Rust B2BUA + AI media bridge) --------------------------

[vokit-edge]
type=endpoint
transport=transport-udp-vokit
context=from-vokit-edge
disallow=all
allow=ulaw
aors=vokit-edge-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[vokit-edge-aor]
type=aor
contact=sip:127.0.0.1:5071
max_contacts=1
qualify_frequency=0

[vokit-edge-identify]
type=identify
endpoint=vokit-edge
match=127.0.0.1
