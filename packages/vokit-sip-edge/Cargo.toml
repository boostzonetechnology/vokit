[package]
name = "vokit-sip-edge"
version = "0.1.0"
edition = "2021"
description = "Vokit SIP B2BUA edge — SIP/RTP G.711 μ-law bridge for Node media (no AI dependencies)"
license = "MIT"

[[bin]]
name = "vokit-sip-edge"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "json"] }
bytes = "1"
dashmap = "5"
futures-util = { version = "0.3", features = ["sink"] }
rsip = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
