[project]
name = "vokit-pipecat-voice"
version = "0.1.0"
description = "Self-hosted Pipecat realtime voice peer for Vokit (Phase 13)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastembed>=0.4",
    "tzdata>=2024.1",
    "pipecat-ai[websocket,webrtc,silero,deepgram,elevenlabs,cartesia,openai,google,anthropic,grok]>=0.0.96",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
